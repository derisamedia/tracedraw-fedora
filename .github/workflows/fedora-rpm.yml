name: Fedora RPM

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, like 0.46.0 (empty: use Cargo.toml version)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf install -y \
            ca-certificates curl git gcc gcc-c++ make pkgconf-pkg-config \
            rpm-build findutils \
            libxkbcommon-devel libxkbcommon-x11-devel wayland-devel \
            mesa-libGL-devel libX11-devel libXcursor-devel libXrandr-devel \
            libXi-devel gtk3-devel

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: fedora-rpm-x86_64

      - name: Version
        id: ver
        shell: bash
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          if [[ -n "$INPUT_RELEASE" ]]; then
            v="${INPUT_RELEASE#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: cargo build --release -p tracedraw -p tracedraw-cli

      - name: Package Fedora RPM
        run: |
          packaging/linux/build-rpm.sh "${{ steps.ver.outputs.version }}" "target/release" "x86_64"
          ls -la dist/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: tracedraw-fedora-rpm
          path: dist/*.rpm
          if-no-files-found: error

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-rpm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: tracedraw-fedora-rpm
          path: artifacts

      - name: Release notes
        shell: bash
        env:
          VERSION: ${{ needs.build-rpm.outputs.version }}
        run: |
          rpm_file=$(basename "$(ls artifacts/*.rpm | head -n 1)")
          {
            echo "## Fedora RPM Installation"
            echo ""
            echo "\`\`\`bash"
            echo "sudo dnf install ./${rpm_file}"
            echo "\`\`\`"
            echo ""
            if grep -q "^## ${VERSION} " CHANGELOG.md 2>/dev/null; then
              echo "## Changes"
              awk -v head="## ${VERSION} " 'index($0, head) == 1 { p = 1; next } /^## / && p { exit } p' CHANGELOG.md
            fi
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.rpm
          tag_name: v${{ needs.build-rpm.outputs.version }}
          name: v${{ needs.build-rpm.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body_path: release-notes.md
